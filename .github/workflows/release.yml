name: Draft release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: ./scripts/release.sh "$RUNNER_TEMP/fleetglass-release"
      - name: Attach artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/fleetglass-release/*.tar.gz "$RUNNER_TEMP"/fleetglass-release/SHA256SUMS --draft --title "Fleetglass $GITHUB_REF_NAME" --notes-file docs/CHANGELOG.md
